; ESP32-S3 Wi-Fi FTM: 3 anchors (plain DevKitC-style N16R8 boards)
; + 1 tag (TENSTAR TS-ESP32-S3 1.14" TFT, an Adafruit Feather S3 TFT clone)
;
;   pio run -e anchor1 -t upload      (repeat for anchor2, anchor3)
;   pio run -e tag -t upload && pio device monitor -e tag

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; Anchors: use the USB-C port labelled COM/UART on these boards
[anchor_base]
board = esp32-s3-devkitc-1
build_src_filter = +<anchor.cpp>

[env:anchor1]
extends = anchor_base
build_flags = -DANCHOR_ID=1

[env:anchor2]
extends = anchor_base
build_flags = -DANCHOR_ID=2

[env:anchor3]
extends = anchor_base
build_flags = -DANCHOR_ID=3

; Tag: the TFT board only has native USB, so Serial goes over USB CDC
[env:tag]
board = adafruit_feather_esp32s3_tft
build_src_filter = +<tag.cpp>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
